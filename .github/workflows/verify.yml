name: Public guide verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          version: "0.10.4"
          python-version: "3.12"
      - run: python scripts/verify_public_release.py
      - run: uv sync --locked --group research
      - run: uv run --locked --group research python scripts/verify_research_source.py
      - run: uv run --locked zensical build
      - run: uv run --locked python scripts/verify_site.py
